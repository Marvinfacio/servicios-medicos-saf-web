        <h1>¿Resfriado o faringoamigdalitis? Cómo saber la diferencia</h1>
        <p>Por Dr. Marvin Facio · Céd. Prof. 12419385</p>
        <p>El dolor de garganta casi siempre es por un virus. Los antibióticos no sirven contra los virus; tomarlos sin receta favorece la resistencia bacteriana. Acude a consulta si la fiebre dura más de 3 días, el dolor es intenso sin tos ni escurrimiento, ves placas blancas en las amígdalas o los síntomas no mejoran en una semana. Acude a urgencias si hay dificultad para respirar o para tragar la saliva.</p>
